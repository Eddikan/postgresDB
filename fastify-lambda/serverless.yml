# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: imeorg
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: imeserverless
# "service" is the name of this project. This will also be added to your AWS resource names.
service: ime-fastify-backend

# Service path - run from parent directory
# This allows proper relative imports in handler
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  
  # VPC Configuration - Add your VPC details from old Lambda
  # vpc:
  #   securityGroupIds:
  #     - sg-xxxxxxxxx  # Copy from old Lambda
  #   subnetIds:
  #     - subnet-xxxxxxxx  # Copy from old Lambda
  #     - subnet-xxxxxxxx  # Copy from old Lambda
  
  # Environment variables - loaded from .env file (secure, not committed to git)
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    PORT: ${env:PORT, '3000'}
    DATABASE_URL: ${env:DATABASE_URL}
    DB_HOST: ${env:DB_HOST}
    DB_NAME: ${env:DB_NAME}
    DB_USERNAME: ${env:DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_PORT: ${env:DB_PORT, '5432'}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    FRONTEND_URL: ${env:FRONTEND_URL}
    MAILTRAP_TOKEN: ${env:MAILTRAP_TOKEN}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN}
    TWILIO_PHONE_NUMBER: ${env:TWILIO_PHONE_NUMBER}
    AWS_S3_BUCKET_NAME: ${env:AWS_S3_BUCKET_NAME}
  
  # IAM permissions (add as needed)
  iam:
    role:
      statements: 
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
        # S3 permissions for file uploads
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - 'arn:aws:s3:::drilling-management-photos/*'
            - 'arn:aws:s3:::drilling-management-photos'
  
  # API Gateway configuration
  httpApi:
    cors:
      allowedOrigins:
        - 'https://www.ime.com.ng'
        - 'http://localhost:3000'
        - 'http://localhost:5173'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowCredentials: true

functions:
  api:
    handler: handler.handler
    timeout: 30  # Increase if needed
    memorySize: 512  # Adjust based on your needs
    events:
      # Catch all routes
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

# Plugins
plugins:
  - serverless-offline  # For local testing

# Package configuration  
package:
  patterns:
    # Include handler
    - 'handler.js'
    - 'handler.js.map'
    # Include copied src files (compiled JS only)
    - 'src/**/*.js'
    - 'src/**/*.js.map'
    # Exclude TypeScript source files
    - '!src/**/*.ts'
    - '!*.ts'
    - '!tsconfig.json'
    - '!predeploy.sh'
    - '!.env*'
    # Exclude unnecessary development files
    - '!.serverless/**'
    - '!.git/**'
    - '!*.md'
    - '!tests/**'
    - '!uploads/**'

# Custom configuration
custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
