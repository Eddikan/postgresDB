# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: imeorg
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: imeserverless
# "service" is the name of this project. This will also be added to your AWS resource names.
service: primefrontier-api

# Service path - run from parent directory
# This allows proper relative imports in handler
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  
  # Environment variables - Loaded from .env file
  # Make sure .env file exists in fastify-lambda folder before deployment
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    DATABASE_URL: ${env:DATABASE_URL}
    DB_HOST: ${env:DB_HOST}
    DB_NAME: ${env:DB_NAME}
    DB_USERNAME: ${env:DB_USERNAME}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_PORT: ${env:DB_PORT, '5432'}
    PORT: ${env:PORT, '3000'}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
    DEFAULT_ADMIN_EMAIL: ${env:DEFAULT_ADMIN_EMAIL}
    DEFAULT_ADMIN_PASSWORD: ${env:DEFAULT_ADMIN_PASSWORD}
    FRONTEND_URL: ${env:FRONTEND_URL}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID, ''}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET, ''}
    GOOGLE_CALLBACK_URL: ${env:GOOGLE_CALLBACK_URL, ''}
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '587'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASS: ${env:SMTP_PASS, ''}
    FROM_EMAIL: ${env:FROM_EMAIL, ''}
    MAILTRAP_TOKEN: ${env:MAILTRAP_TOKEN, ''}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
    TWILIO_PHONE_NUMBER: ${env:TWILIO_PHONE_NUMBER, ''}
  
  # IAM permissions (add as needed)
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
  
  # API Gateway configuration
  httpApi:
    cors:
      allowedOrigins:
        - ${env:FRONTEND_URL}
        - 'http://localhost:3000'
        - 'http://localhost:5173'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowCredentials: true

functions:
  api:
    handler: handler.handler
    timeout: 30  # Increase if needed
    memorySize: 512  # Adjust based on your needs
    events:
      # Catch all routes
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

# Plugins
plugins:
  - serverless-offline  # For local testing

# Package configuration  
package:
  patterns:
    # Include handler
    - 'handler.js'
    - 'handler.js.map'
    # Include copied src files (compiled JS only)
    - 'src/**/*.js'
    - 'src/**/*.js.map'
    # Exclude TypeScript source files
    - '!src/**/*.ts'
    - '!*.ts'
    - '!tsconfig.json'
    - '!predeploy.sh'
    - '!.env*'
    # Exclude unnecessary development files
    - '!.serverless/**'
    - '!.git/**'
    - '!*.md'
    - '!tests/**'
    - '!uploads/**'

# Custom configuration
custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
